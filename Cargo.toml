[package]
name = "cli-warden"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
aho-corasick = "1"
clap = { version = "4", features = ["derive"] }
dialoguer = "0.11"
glob = "0.3"
regex = "1"
rcgen = "0.13"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "process", "io-util", "time", "signal"] }
tokio-stream = "0.1"
toml = "0.8"
tonic = { version = "0.12", features = ["transport", "tls", "tls-roots"] }
prost = "0.13"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[build-dependencies]
protoc-bin-vendored = "3"
tonic-build = "0.12"

[dev-dependencies]
tempfile = "3"
